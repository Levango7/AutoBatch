[pytest]
testpaths = tests
pythonpath = .

# =============================================================================
# 自定义 markers 声明（任务61 修复）
# 避免 pytest 在使用未声明 marker 时产生 PytestUnknownMarkWarning
# =============================================================================
markers =
    slow: 标记运行耗时的测试（默认不跑，用 --runslow 显式启用）
    cluster: 标记需要真实集群环境的测试（默认跳过，需 HADOOP_CONF_DIR 等环境变量）
    iceberg: 标记需要 Iceberg JAR 与 Spark 集成的测试（默认跳过）
    spark: 标记需要 Spark 运行时的测试（需 JDK17+ 与 pyspark）
    polars: 标记需要 polars 引擎的测试
    parquet: 标记需要 pyarrow / parquet 写入能力的测试
    minio: 标记需要 MinIO S3 兼容服务的测试（默认跳过，需 MINIO_ENDPOINT 环境变量）
    integration: 标记集成测试（跨模块 / 跨服务，运行较慢）
    benchmark: 标记基准测试（默认 skip，手动运行）

# =============================================================================
# 警告过滤（任务61 修复）
# 忽略第三方库的噪声警告，保持输出聚焦
# =============================================================================
filterwarnings =
    # pyspark 在 Python 3.12+ 上有大量 DeprecationWarning，属库内部问题
    ignore::DeprecationWarning:pyspark.*
    # pyarrow 类型系统迁移警告
    ignore::DeprecationWarning:pyarrow.*
    # py4j Java 桥接警告
    ignore::DeprecationWarning:py4j.*
    # pytest 自身关于 jinja2 的兼容性警告（pytest-cov 依赖）
    ignore::DeprecationWarning:_pytest.*
