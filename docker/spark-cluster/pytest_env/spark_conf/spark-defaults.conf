# 测试进程 Driver 端兜底配置（由 pytest_env/sitecustomize.py 经 SPARK_CONF_DIR 注入，
# 仅带该 PYTHONPATH 启动的 pytest/python 进程生效，不改全局、不影响容器内集群配置）.
#
# 背景（2026-08-26）：本机 Windows 启用了 Hyper-V/WSL，netsh 显示 tcp 4002-4101
# 处于系统保留区间（excludedportrange）。SparkUI 默认从 4040 起绑定，失败后按
# spark.port.maxRetries=16 重试至 4056，全部落入保留区，导致 SparkContext 构造
# 抛 BindException 并连带 JVM gateway 崩溃（JAVA_GATEWAY_EXITED 同款症状）。
# 测试进程对 Web UI 无监控需求，直接禁用；pipeline 代码中显式设置的 SparkConf
# 优先级高于本文件，不受影响。
spark.ui.enabled false