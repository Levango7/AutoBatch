# =============================================================================
# AutoBatch 项目配置（ruff + mypy + pytest）
# Phase 6 CI/CD 加固：统一 lint / type-check / 测试配置入口
# =============================================================================

[build-system]
# 纯标准库项目，无需打包；保留占位以便 IDE / 工具识别
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# =============================================================================
# [project] 元数据（任务61 修复）
# PEP 621 标准：声明项目名称、版本、Python 版本要求、依赖
# 运行时零依赖（仅标准库），可选依赖在 [project.optional-dependencies] 中分组
# =============================================================================
[project]
name = "autobatch"
version = "1.5.0"
description = "AutoBatch：可扩展批处理流水线框架（零运行时依赖，按需启用 polars/spark/iceberg 后端）"
readme = "readme.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "AutoBatch Team" },
]
keywords = ["batch", "pipeline", "etl", "polars", "spark", "iceberg"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
# 运行时零依赖：仅依赖 Python 3.9+ 标准库
dependencies = []

# -----------------------------------------------------------------------------
# [project.optional-dependencies]：按功能分组的可选依赖
# 安装方式：pip install autobatch[polars,storage] 或 pip install autobatch[dev]
# 版本上界与 requirements.txt 保持一致，避免主版本升级引入 breaking change
# -----------------------------------------------------------------------------
[project.optional-dependencies]
# 列式加速后端（engine.backend="polars"）
polars = [
    "polars>=1.0,<2.0",
]
# Spark 分布式加速后端（engine.backend="spark"，需 JDK17+）
spark = [
    "pyspark>=4.0,<5.0",
]
# 湖存储后端（storage.backend="parquet" / minio）
storage = [
    "pyarrow>=14.0,<20.0",
    "minio>=7.0,<8.0",
]
# 监控告警（monitoring.enabled=true）
monitoring = [
    "psutil>=5.9,<7.0",
]
# 全部运行时可选依赖（polars + spark + storage + monitoring）
all = [
    "polars>=1.0,<2.0",
    "pyspark>=4.0,<5.0",
    "pyarrow>=14.0,<20.0",
    "minio>=7.0,<8.0",
    "psutil>=5.9,<7.0",
]
# 开发 / CI 依赖（与 requirements-dev.txt 同步）
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<6.0",
    "ruff>=0.6.0,<1.0",
    "mypy>=1.10.0,<2.0",
    "pip-audit>=2.7.0,<3.0",
]

# -----------------------------------------------------------------------------
# ruff：极速 lint + format checker（替代 flake8 + black + isort）
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100                 # 单行最大宽度
target-version = "py39"           # 最低支持 Python 3.9（与运行时零依赖声明一致）
extend-exclude = [
    ".pytest_cache",
    "htmlcov",
    "build",
    "dist",
]

[tool.ruff.lint]
# 选用规则集：
#   E  - pycodestyle errors
#   W  - pycodestyle warnings
#   F  - pyflakes（未使用变量 / 未定义符号等）
#   I  - isort（import 顺序）
#   B  - bugbear（常见 bug 模式）
#   UP - pyupgrade（语法现代化）
#   N  - pep8-naming（命名规范）
select = ["E", "W", "F", "I", "B", "UP", "N"]
ignore = [
    "E501",   # 行长由 line-length 控制，formatter 已处理；保留以避免与格式化冲突
    "B008",   # 函数调用作为默认参数（pytest fixture 常见用法）
    "N802",   # 函数名应为小写（pytest 测试函数 test_Xxx 风格保留）
    "N803",   # 参数名应为小写（数学/科学命名习惯，如 X、Y）
    "N806",   # 变量名应为小写（同上）
    "N812",   # lowercase-imported-as-non-lowercase：pyspark `from pyspark.sql import functions as F` 是官方惯例
    "UP007",  # Optional[X] vs X | None：保留 Optional 以兼容 py39
    "UP045",  # 同上：Union 类型写法
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "F401",   # 测试文件允许未使用 import（fixture / conftest 模式）
    "F811",   # 允许重定义（pytest parametrize 重名）
    "N802",   # 测试函数命名宽松
]

[tool.ruff.format]
quote-style = "double"            # 双引号
indent-style = "space"            # 空格缩进
line-ending = "lf"                # 统一 LF 行尾

# -----------------------------------------------------------------------------
# mypy：静态类型检查
# -----------------------------------------------------------------------------
[tool.mypy]
# pyproject.toml 是 TOML 文件：section 不能重复覆盖，只能完整替换。
# 因此移除 [[tool.mypy.overrides]] 块，改在顶层统一 ignore_missing_imports。
# 注意：mypy 2.x 最低支持 python_version = "3.10"（与 CI 质量矩阵 3.10 对齐）；
# 3.9 运行时兼容性由 ci.yml 矩阵的 3.10 腿验证。
python_version = "3.10"          # mypy 2.x 最低 target；运行时兼容 py39
files = ["src"]                  # 仅检查 src/ 目录（业务代码）
exclude = [
    "tests/",
    "build/",
    "dist/",
]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = false      # 改为 false，避免 mypy 把配置本身报错阻塞 CI
ignore_missing_imports = true    # 第三方 SDK (pyspark / polars / pyarrow / minio 等) 无类型存根
disallow_any_generics = false
disallow_any_explicit = false
disallow_any_expr = false
check_untyped_defs = false       # 不检查未注解函数体（项目渐进式迁移中，避免噪音）
allow_redefinition = true        # 允许条件重定义（兼容运行时分支）

# -----------------------------------------------------------------------------
# pytest 配置：保留在 pytest.ini 中（已存在），此处不重复以避免配置冲突警告
# -----------------------------------------------------------------------------