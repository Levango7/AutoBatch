# ── AutoBatch Spark Standalone Cluster ──────────────────────────
# Master (1) + Worker (2) → Standalone 模式
# 网络: autobatch-net (bridge)
# ────────────────────────────────────────────────────────────────

services:
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-master
    hostname: spark-master
    environment:
      SPARK_MODE: master
    ports:
      # 显式绑定 127.0.0.1：规避 Windows 上 0.0.0.0 通配绑定的幽灵占用
      # （GetActiveTcpListeners 可见无属主的 0.0.0.0:8080 监听，导致
      #  com.docker.backend 报 "ports are not available"；具体 IP 绑定可共存）
      # 测试/Driver 均通过 localhost 访问，127.0.0.1 绑定完全满足需求
      - "127.0.0.1:15077:7077"   # Spark Master RPC
      - "127.0.0.1:8080:8080"    # Master Web UI / REST API
    networks:
      - autobatch-net
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-worker-1
    hostname: spark-worker-1
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
    ports:
      - "127.0.0.1:8081:8081"   # Worker-1 Web UI
    networks:
      - autobatch-net
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      # Worker Web UI 在 8081；ALIVE 状态需 Master 注册后才有，start_period 给足时间
      test: ["CMD", "curl", "-fsSL", "http://localhost:8081"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  spark-worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-worker-2
    hostname: spark-worker-2
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
    ports:
      - "127.0.0.1:8082:8081"   # Worker-2 Web UI → 宿主机 8082
    networks:
      - autobatch-net
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:8081"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

networks:
  autobatch-net:
    name: autobatch-net
    driver: bridge