# =============================================================================
# AutoBatch 代码质量工作流
# Phase 6 CI/CD 加固 + 任务61 修复 + 任务78 修复：
#   - 与 ci.yml 分工：ci.yml 跑测试矩阵 + smoke test；quality.yml 跑 lint + type-check + coverage 门禁
#   - runner 用 Python 3.12（与 ci.yml 的 Linux 矩阵各腿版本对齐）；mypy 类型检查目标
#     python_version="3.10"（pyproject.toml，mypy 2.x 最低只支持 target 3.10）——
#     类型检查目标版本与 runner 运行时版本是两回事，二者并存是有意为之
#   - 覆盖率门禁用 pytest 直出（任务78）：`pytest --cov=src --cov-fail-under=60`，
#     门禁判断 = pytest 退出码（测试失败或覆盖率低于阈值即 job 失败）。
#     不再依赖 tools/quality_collect.py 的中间收集结果做门禁判断——该步骤在 GHA
#     runner 上有已知平台层故障（见步骤注释），现降级仅做产物归档
#   - CI 去重（2026-08 审查 P3）：原「Collect pytest log (archive only)」步骤
#     经 quality_collect.py 再跑一遍全量 suite 仅用于日志归档，且在 GHA runner
#     平台层故障下恒失败，已移除；门禁由 coverage gate 步骤独家承担
#   - ruff check 范围含 tools/（quality_collect.py 等 CI 基础设施同样受 lint 约束）
#   - 顶层 concurrency 取消同分支旧任务，节省 CI 资源
# =============================================================================
name: Quality / AutoBatch Code Quality

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'release/*'
  pull_request:

# 同一分支并发时取消旧任务，节省 CI 资源
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Type Check + Coverage Gate
    runs-on: ubuntu-latest
    # 质量门禁不阻塞其他矩阵任务（ci.yml 已并行跑测试）
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------------------------
      # Python 3.12：与 ci.yml Linux 矩阵版本对齐。mypy 的 python_version="3.10"
      # （pyproject.toml）只是 mypy 2.x 的最低类型检查目标版本（mypy 2.x 不支持
      # 更低的 target），与 runner 运行时版本无关——二者并存是有意为之。
      # -------------------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies (runtime + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          # 引擎依赖与 ci.yml 对齐：此前 3.10+无引擎依赖组合下 pytest 曾零输出
          # 秒退（2026-08 连续数轮未定位），对齐绿腿环境以收敛变量
          # pyiceberg==0.12.0rc1 精确 pin：PyPI 无 0.12.0 正式版（原因见 ci.yml 注释）
          pip install "pyspark>=4.0,<5.0" "polars>=1.0,<2.0" "pyarrow>=23.0.1,<25.0" "pyiceberg==0.12.0rc1"

      # -------------------------------------------------------------------------
      # 1. ruff lint（pyproject.toml 配置）
      #    范围含 tools/：quality_collect.py 等 CI 基础设施脚本此前零 lint 覆盖，
      #    任务78 起纳入检查（违规已于任务78 内修复，不改变脚本行为）。
      # -------------------------------------------------------------------------
      - name: Ruff lint check
        run: |
          echo "::group::Ruff lint"
          ruff check src/ tests/ tools/ scripts/ dashboard/ --config pyproject.toml
          echo "::endgroup::"

      # -------------------------------------------------------------------------
      # 2. ruff format check（不修改文件，仅校验）
      # -------------------------------------------------------------------------
      - name: Ruff format check
        run: |
          echo "::group::Ruff format"
          ruff format --check src/ tests/ scripts/ dashboard/ --config pyproject.toml
          echo "::endgroup::"

      # -------------------------------------------------------------------------
      # 3. mypy 静态类型检查（仅 src/，渐进式启用）
      #    类型检查目标版本以 pyproject.toml 的 python_version="3.10" 为准
      #    （这是 mypy 的类型检查 target，不是 runner 的运行时版本 3.12）
      # -------------------------------------------------------------------------
      - name: Mypy type check
        run: |
          echo "::group::Mypy"
          mypy src/ --config-file pyproject.toml
          echo "::endgroup::"

      # -------------------------------------------------------------------------
      # 4. 覆盖率门禁（权威门禁，pytest 直出模式 —— 任务78 修复）
      #    门禁判断 = pytest 退出码：测试失败、或覆盖率低于 60%
      #    （--cov-fail-under=60）任一情形均非零退出，本步骤与 job 直接失败。
      #    不再依赖 tools/quality_collect.py 的中间收集结果做门禁判断
      #    （旧方案中 collect 步骤 continue-on-error + 门禁步骤的 if 条件依赖
      #    collect 成功，导致门禁事实上从未执行；该脚本在 GHA runner 上另有
      #    平台层故障，见下方步骤 5 注释）。
      #    排除 cluster 测试：CI 无 Docker Spark 集群，JVM 检查可能通过但
      #    SparkContext 初始化会失败，导致整个 suite 非零退出。
      #    阈值 60% 依据：本地 2026-08-25 覆盖率快照约 74.5%（22 文件口径）；
      #    CI 上同样排除 cluster 测试、spark/cluster 依赖用例与本地同样经
      #    skipif 跳过，60% 留有余量。
      #    覆盖率报告（coverage.xml / htmlcov/）由本步骤同步生成，供后续
      #    artifact 上传步骤归档。不使用 tee 管道：退出码直达步骤结论。
      # -------------------------------------------------------------------------
      - name: Coverage gate (pytest --cov-fail-under=60)
        id: coverage_gate
        run: |
          echo "::group::pytest coverage gate"
          python -m pytest tests/ \
            -k "not cluster" \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html \
            --cov-fail-under=60 \
            --tb=short
          echo "::endgroup::"

      # -------------------------------------------------------------------------
      # 5.（已移除）pytest 日志收集步骤 —— 2026-08 审查 P3 CI 去重
      #    原「Collect pytest log (archive only)」步骤经 tools/quality_collect.py
      #    再跑一遍全量 suite，仅用于归档日志，却在 GHA runner 上有已知平台层
      #    故障（exit 1 零输出秒退，连续 5 轮未解），且与步骤 4 的 coverage 门禁
      #    pytest 构成重复执行。门禁职责已由步骤 4 直接承担，本步骤的日志归档
      #    价值可由步骤 4 的 job 日志 + ci.yml 的失败注解替代。按原注释「该平台
      #    故障恢复后若确认不再需要日志归档，可连同 Upload pytest log 步骤一并
      #    移除」，此处移除该步骤及下方 Upload pytest log 步骤。
      #    tools/quality_collect.py 脚本本身保留（tests/test_tools_quality_collect.py
      #    仍有其单测），仅不再被 CI 调用。
      # -------------------------------------------------------------------------

      # -------------------------------------------------------------------------
      # 6. 上传覆盖率 artifacts（保留 14 天）
      #    coverage.xml / htmlcov/ 由步骤 4 的门禁 pytest 生成；if: always()
      #    保证即便门禁失败（覆盖率不达标/测试失败）报告仍可下载排查。
      # -------------------------------------------------------------------------
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

      # 注：旧方案的独立门禁步骤「Enforce coverage threshold」（coverage report
      # --fail-under=60，if 依赖 collect 步骤 outcome）已于任务78 移除——collect
      # 在 GHA runner 上的平台层故障导致该条件恒不满足，门禁从未生效。门禁
      # 职责现由步骤 4「Coverage gate (pytest --cov-fail-under=60)」的退出码
      # 直接承担，不再经过任何中间步骤的条件判断。
