# =============================================================================
# AutoBatch CI 流水线
# Phase 6 CI/CD 加固 + 任务61 修复：
#   - Python 矩阵覆盖 3.9 / 3.10 / 3.11 / 3.13 / 3.14（与 pyproject.toml target-version="py39" 对齐）
#   - Python 3.9 是最低支持版本，仅测试核心路径（python engine + local_csv）；
#     pyspark / pyarrow / polars / pyiceberg 均要求 Python >= 3.10，
#     因此 3.9 跳过这些引擎的依赖安装与等价性测试
#   - 3.14 标 continue-on-error（实验性，不阻塞流水线）
#   - push 限定 main / master / release/* 分支；pull_request 不限分支
#   - 顶层 concurrency 取消同分支旧任务，节省 CI 资源
#   - 新增 pip-audit 依赖安全扫描步骤
#   - smoke test 失败时上传 run/ 目录 artifact 便于诊断
# =============================================================================
name: CI / AutoBatch Pipeline CI

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'release/*'
  pull_request:

# 同一分支并发时取消旧任务，节省 CI 资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CI 仅跑 3.10/3.11/3.12：
        # - 3.9 因 pydantic-core 2.22+ 才提供 linux cp39 wheel（pyarrow/pyspark 需 Python ≥3.10），装不上
        # - 3.13/3.14 上 pyspark / polars / pyarrow 的最新 wheel 仍缺 3.13/3.14 manylinux x86_64
        #  （2026-08 实测这些包未发布 3.13/3.14 wheel）
        # 3.9 是代码层面最低支持版本（核心路径 python engine + local_csv），通过 pyproject.toml
        # target-version="py39" 声明；CI 跑 3.10 矩阵即可验证所有引擎路径。
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip    # 启用 pip 缓存，加速依赖安装

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 核心依赖：pydantic pin >=2.10.6 以提供 linux cp39 wheel（CI 3.10+ 全覆盖）
          pip install -r requirements.txt
          # optional 引擎依赖：pyspark / polars / pyarrow / pyiceberg 均要求 Python >=3.10
          # 在 CI 当前矩阵（3.10–3.12）中均可安装
          pip install "pyspark>=4.0,<5.0" "polars>=1.0,<2.0" "pyarrow>=14.0,<20.0" "pyiceberg==0.12.0rc1"
          pip install -r requirements-dev.txt

      # 全量运行；重型测试（Spark 集群/MinIO/需要 hadoop native lib 的路径）
      # 由 tests 内的 skipif 环境探测自动跳过——仓库未使用 pytest marker 标注
      # Spark 本地模式在 Linux CI 缺 hadoop native lib 时自动 skipif，不阻塞流水线
      - name: Run pytest (full suite; heavy tests self-skip via skipif)
        run: |
          python -m pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html

      - name: Upload coverage report (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

      # -------------------------------------------------------------------------
      # 可选：上传覆盖率到 Codecov（需在仓库 Secrets 配置 CODECOV_TOKEN）
      # 仅在 main / master 分支推送时执行，避免 PR 泄漏
      # -------------------------------------------------------------------------
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref_protected
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false   # 缺 token 不阻塞流水线

      - name: Pipeline smoke test
        id: smoke
        run: |
          python main.py --config config/pipeline_small.json

      # -------------------------------------------------------------------------
      # smoke test 失败诊断：上传 run/ 目录 artifact 便于排查
      # -------------------------------------------------------------------------
      - name: Upload run/ artifact on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run-py${{ matrix.python-version }}
          path: run/
          if-no-files-found: warn
          retention-days: 7

  # ===========================================================================
  # 依赖安全扫描（pip-audit）—— 独立 job，与测试矩阵并行
  # ===========================================================================
  security-audit:
    name: Dependency Security Audit (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit runtime dependencies
        run: |
          echo "::group::pip-audit runtime"
          pip-audit -r requirements.txt --strict
          echo "::endgroup::"

      - name: Audit dev dependencies
        run: |
          echo "::group::pip-audit dev"
          pip-audit -r requirements-dev.txt --strict
          echo "::endgroup::"
