[pytest]
testpaths = tests
pythonpath = .

# =============================================================================
# 自定义 markers 声明（任务61 新增声明，任务73 修正说明）
# 避免 pytest 在使用未声明 marker 时产生 PytestUnknownMarkWarning。
# 现状说明：经全仓 grep 确认，目前没有任何测试通过 @pytest.mark.<name> 使用
# 以下 marker（各测试的跳过均由模块内 skipif 条件变量控制，例如
# SPARK_WRITE_DISABLED / CLUSTER_SKIP / MINIO_AVAILABLE / SPARK_ICEBERG_DISABLED），
# 此处声明为保留项，用于未来按 marker 做 -m 过滤。
# =============================================================================
markers =
    slow: 声明性 marker；标记运行耗时的测试。跳过/启用由 tests/conftest.py 的 pytest_addoption(--runslow) 与 pytest_collection_modifyitems 统一控制：默认跳过，显式传 --runslow 执行
    cluster: 声明性 marker；标记需要真实集群环境的测试。当前无测试使用此 marker，相关跳过实际由模块内 skipif 条件变量（如 Spark Master 可达性 CLUSTER_SKIP）控制，保留用于未来 -m 过滤
    iceberg: 声明性 marker；标记需要 Iceberg JAR 与 Spark 集成的测试。当前无测试使用此 marker，相关跳过实际由模块内 skipif 条件变量（如 SPARK_ICEBERG_DISABLED / PYICEBERG_AVAILABLE）控制，保留用于未来 -m 过滤
    spark: 声明性 marker；标记需要 Spark 运行时的测试（JDK17+ 与 pyspark）。当前无测试使用此 marker，相关跳过实际由模块内 skipif 条件变量（如 SPARK_WRITE_DISABLED）控制，保留用于未来 -m 过滤
    polars: 声明性 marker；标记需要 polars 引擎的测试。当前无测试使用此 marker，保留用于未来 -m 过滤
    parquet: 声明性 marker；标记需要 pyarrow / parquet 写入能力的测试。当前无测试使用此 marker，保留用于未来 -m 过滤
    minio: 声明性 marker；标记需要 MinIO S3 兼容服务的测试。当前无测试使用此 marker，相关跳过实际由 MINIO_AVAILABLE skipif 条件控制，保留用于未来 -m 过滤
    integration: 声明性 marker；标记集成测试（跨模块 / 跨服务）。当前无测试使用此 marker，保留用于未来 -m 过滤
    benchmark: 声明性 marker；标记基准测试（tests/test_benchmark.py）。当前无测试使用此 marker，其默认跳过由 tests/conftest.py 的 pytest_collection_modifyitems 统一控制，显式传 --runslow 执行，保留用于未来 -m 过滤

# =============================================================================
# 警告过滤（任务61 修复）
# 忽略第三方库的噪声警告，保持输出聚焦
# =============================================================================
filterwarnings =
    # pyspark 在 Python 3.12+ 上有大量 DeprecationWarning，属库内部问题
    ignore::DeprecationWarning:pyspark.*
    # pyarrow 类型系统迁移警告
    ignore::DeprecationWarning:pyarrow.*
    # py4j Java 桥接警告
    ignore::DeprecationWarning:py4j.*
    # pytest 自身关于 jinja2 的兼容性警告（pytest-cov 依赖）
    ignore::DeprecationWarning:_pytest.*
