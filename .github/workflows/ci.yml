# =============================================================================
# AutoBatch CI 流水线
# Phase 6 CI/CD 加固 + 任务61 修复 + 任务78 修复：
#   - CI 矩阵：ubuntu-latest × 3.10/3.11/3.12（build job，附 MinIO service）
#     + macos-latest × 3.12 单腿（build-macos job，POSIX 兼容验证）
#   - 版本说明（如实描述，任务78 修订）：
#     · 3.9 不在 CI：pyproject.toml 已声明 requires-python=">=3.10"
#      （ruff target-version="py310"、mypy python_version="3.10" 同步对齐），
#       不再有 3.9 支持声明，也没有 3.9 CI 腿
#     · 3.13/3.14 未纳入 CI 测试矩阵。应用的 Docker 运行镜像已对齐到
#       python:3.12-slim（见根目录 Dockerfile，安装完整 requirements.txt），
#       与本矩阵 3.12 腿同版本，镜像内依赖组合获得 CI 实测覆盖。
#       （此前镜像为 python:3.13.1-slim 且无任何 CI 腿验证，已修正。）
#   - build job 附 MinIO service：tests/test_storage_parquet.py 的 S3 测试此前
#     因 CI 无 MinIO 服务、_minio_available() 探测 localhost:9000 恒失败而永久
#     跳过；加 service 后在 Linux 腿实际运行。GHA service 容器仅支持 Linux
#     runner，macOS 腿无法附加 services，相应测试继续经 skipif 自动跳过。
#   - push 限定 main / master / release/* 分支；pull_request 不限分支
#   - 顶层 concurrency 取消同分支旧任务，节省 CI 资源
#   - pip-audit 依赖安全扫描为独立 job，与测试矩阵并行
#   - smoke test 失败时上传 run/ 目录 artifact 便于诊断
#   - spark-cluster job（2026-08-28）：ubuntu 单腿用 docker compose 拉起
#     docker/spark-cluster 真集群（master+2 worker）+ MinIO service，
#     跑 tests/test_engine_spark_cluster.py 4 个集群测试；Driver 端 S3A JAR
#     按 docker/spark-cluster/Dockerfile 钉扎版本下载并 SHA1 校验
# =============================================================================
name: CI / AutoBatch Pipeline CI

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'release/*'
  pull_request:

# 同一分支并发时取消旧任务，节省 CI 资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Linux 测试矩阵：ubuntu-latest × 3.10/3.11/3.12（附 MinIO service）
  # ===========================================================================
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CI 矩阵覆盖 3.10/3.11/3.12，与 pyproject.toml 声明的最低支持版本
        # 一致（requires-python=">=3.10"）。无 3.9 腿：3.9 已不在支持声明内，
        # CI 也从未有过 3.9 腿（旧注释声称"3.9 跑 python engine 核心路径"
        # 与实际不符，任务78 已修正为如实描述）。
        # 3.13/3.14 不在矩阵：应用 Docker 运行镜像为 python:3.12-slim
        # （根目录 Dockerfile，与本矩阵 3.12 腿同版本，见顶部版本说明）
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'

    # -------------------------------------------------------------------------
    # MinIO service（任务78 新增）：让 tests/test_storage_parquet.py 与
    # tests/conftest.py 中被 MINIO_AVAILABLE skipif 跳过的 S3 测试实际运行。
    #   - image 锁定版本，与 docker/iceberg/docker-compose.yml 第 28 行一致
    #     （minio/minio:RELEASE.2024-08-29T01-40-52Z），避免 :latest 漂移
    #   - 9000/9001 端口映射到 runner 宿主 localhost；测试侧探测与访问方式：
    #     tests/conftest.py _minio_available() 与 s3_env fixture 直连
    #     localhost:9000，期望凭证 access_key/secret_key = minioadmin，
    #     bucket = "autobatch"（tests/test_storage_parquet.py 第 31-43 行同）
    #   - 无需 minio-init 建桶步骤：conftest 与 test_storage_parquet 的
    #     _minio_available() 在 bucket 缺失时会自行 make_bucket("autobatch")
    #   - GHA service 容器仅支持 Linux runner（macOS 腿 build-macos job
    #     无法定义 services，S3 测试经 skipif 自动跳过，与加 service 前行为一致）
    # -------------------------------------------------------------------------
    services:
      minio:
        image: minio/minio:RELEASE.2024-08-29T01-40-52Z
        command: server /data --console-address ":9001"
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip    # 启用 pip 缓存，加速依赖安装

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 核心依赖（版本约束见 requirements.txt，与 pyproject.toml 可选依赖分组同步）
          pip install -r requirements.txt
          # optional 引擎依赖：pyspark / polars / pyarrow / pyiceberg 均要求 Python >=3.10，
          # 在 CI 当前矩阵（3.10–3.12）中均可安装；pyarrow>=23.0.1 修复 PYSEC-2026-113
          # pyiceberg==0.12.0rc1 精确 pin：PyPI 无 0.12.0 正式版（区间 >=0.12.0 无解，
          # 0cda952 曾因此全矩阵失败）；预发布精确 pin 无需 --pre 可直接安装
          pip install "pyspark>=4.0,<5.0" "polars>=1.0,<2.0" "pyarrow>=23.0.1,<25.0" "pyiceberg==0.12.0rc1"
          pip install -r requirements-dev.txt

      # 全量运行；重型测试（Spark 集群 / 需要 hadoop native lib 的路径）
      # 由 tests 内的 skipif 环境探测自动跳过——仓库未使用 pytest marker 标注。
      # S3（MinIO）测试在本 Linux 腿因 job 级 minio service 而实际运行
      # （任务78 前因无 MinIO 服务永久跳过）；Spark 本地模式在 Linux CI
      # 缺 hadoop native lib 时经 skipif 自动跳过，不阻塞流水线。
      # 注意：Spark cluster 测试在本 job 中仍排除（本 job 无集群），由下方
      # 独立的 spark-cluster job 拉起真集群专跑（2026-08-28 起）
      # 显式 shell: bash 使 GHA 以 `bash --noprofile --norc -eo pipefail` 运行：
      # 默认的 `bash -e {0}` 不含 pipefail，pytest 经 tee 管道后失败会被掩蔽
      # （管道退出码取 tee 恒为 0）——这是 2026-08 审计发现的 P0 门禁缺陷.
      - name: Run pytest (full suite; heavy tests self-skip via skipif)
        shell: bash
        run: |
          set -eo pipefail
          python -m pytest tests/ -v \
            -k "not cluster" \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html \
            --tb=short \
            2>&1 | tee /tmp/pytest-ci.log

      # 失败诊断：把 FAILED/ERROR 用例转成 ::error:: 注解——注解经 check-runs
      # 公开 API 可读，弥补 job 日志需要鉴权、无法匿名排查的问题.
      - name: Surface failed tests as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) " /tmp/pytest-ci.log | head -30 | while IFS= read -r line; do
            echo "::error::${line:0:180}"
          done
          grep -E "^(FAILED|ERROR) " /tmp/pytest-ci.log | head -30 || echo "::error::no FAILED lines parsed (crash before summary?)"

      - name: Upload coverage report (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # artifact 名称含 os 维度（任务71）：本 job 为 ubuntu-latest 矩阵，
          # 与 build-macos job 的 3.12 腿同版本共存，仅按 python-version 命名
          # 会重名，upload-artifact@v4 对同一 run 内重名直接报错（未设
          # overwrite）——os 后缀消除碰撞。job 拆分后 os 固定，直接写字面量。
          name: coverage-py${{ matrix.python-version }}-ubuntu-latest
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

      # -------------------------------------------------------------------------
      # 可选：上传覆盖率到 Codecov（需在仓库 Secrets 配置 CODECOV_TOKEN）
      # 仅在 main / master 分支推送时执行，避免 PR 泄漏
      # -------------------------------------------------------------------------
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref_protected
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false   # 缺 token 不阻塞流水线

      - name: Pipeline smoke test
        id: smoke
        run: |
          python main.py --config config/pipeline_small.json

      # -------------------------------------------------------------------------
      # smoke test 失败诊断：上传 run/ 目录 artifact 便于排查
      # -------------------------------------------------------------------------
      - name: Upload run/ artifact on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          # 同上：os 字面量后缀防止与 build-macos job 的 3.12 腿 artifact 重名
          name: smoke-run-py${{ matrix.python-version }}-ubuntu-latest
          path: run/
          if-no-files-found: warn
          retention-days: 7

  # ===========================================================================
  # Spark 集群测试腿（2026-08-28）：ubuntu 单腿，docker compose 拉起真集群
  # （spark-master + 2 worker，镜像由 docker/spark-cluster/Dockerfile 构建）
  # + MinIO service，专跑 tests/test_engine_spark_cluster.py 的 4 个集群测试。
  #
  # 与本地 WSL2/Docker Desktop 验证（DELIVERY.md 第五节）同链路，差异点：
  #   - 原生 Linux 容器内 host.docker.internal 由 compose 的 extra_hosts
  #     (host-gateway) 提供；Driver 通告地址用 SPARK_CLUSTER_DRIVER_HOST
  #     覆盖 conftest 的 localhost 缺省（tests/conftest.py 集群 fixture）
  #   - MinIO service 容器默认在 job 网络，用 docker network connect
  #     --alias minio 接入 autobatch-net：worker 容器内 socat 代理
  #     （entrypoint.sh 固定转发 localhost:9000 → minio:9000）经 DNS
  #     别名找到 MinIO；Driver 端 pyarrow 走 service 的 9000 端口映射
  #   - Driver 端 S3A 三件套（hadoop-aws / aws-sdk-v2-bundle /
  #     analyticsaccelerator-s3）按 Dockerfile 钉扎版本下载进
  #     pyspark/jars/ 并 SHA1 校验（Worker 端已在镜像内）
  #   - pyspark==4.2.0 与镜像 SPARK_VERSION=4.2.0 钉扎一致：Driver 与
  #     Worker 的 Spark 小版本必须匹配（本地模式无此约束，集群有）
  # ===========================================================================
  spark-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      minio:
        image: minio/minio:RELEASE.2024-08-29T01-40-52Z
        command: server /data --console-address ":9001"
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin, 与集群镜像基座一致)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pyspark==4.2.0 与集群镜像 SPARK_VERSION=4.2.0 钉扎一致
          #（Driver/Worker Spark 小版本错配在 standalone 集群上直接报错）
          pip install "pyspark==4.2.0" "polars>=1.0,<2.0" "pyarrow>=23.0.1,<25.0"
          pip install -r requirements-dev.txt

      # Driver 端 S3A JAR：版本/SHA1 与 docker/spark-cluster/Dockerfile 钉扎
      # 完全一致（改 Dockerfile 时必须同步此处与 cache key）。缓存大文件
      # aws-sdk-v2-bundle（~654MB），key 不含版本号、以内容校验兜底。
      - name: Cache S3A driver JARs
        uses: actions/cache@v4
        with:
          path: .s3a-jars
          key: s3a-jars-hadoop-aws-3.5.0-bundle-2.35.4-aacc-1.3.1

      - name: Download S3A driver JARs (pinned + SHA1 verified)
        run: |
          set -euo pipefail
          mkdir -p .s3a-jars
          dl() { # dl <输出文件> <maven路径> <sha1>
            if [ ! -s ".s3a-jars/$1" ]; then
              curl -fsSL --retry 3 --retry-delay 3 \
                -o ".s3a-jars/$1" \
                "https://repo1.maven.org/maven2/$2"
            fi
            echo "$3  .s3a-jars/$1" | sha1sum -c -
          }
          dl hadoop-aws-3.5.0.jar \
            org/apache/hadoop/hadoop-aws/3.5.0/hadoop-aws-3.5.0.jar \
            9e594525d264c0db653c7f68da98b245f7d61ea5
          dl bundle-2.35.4.jar \
            software/amazon/awssdk/bundle/2.35.4/bundle-2.35.4.jar \
            7252265e3970b214708e68a8b74a8fa8c875af1e
          dl analyticsaccelerator-s3-1.3.1.jar \
            software/amazon/s3/analyticsaccelerator/analyticsaccelerator-s3/1.3.1/analyticsaccelerator-s3-1.3.1.jar \
            6c9bd0f6c440c9a78e82d272f5f0252d942419f6

      - name: Install S3A JARs into driver pyspark/jars
        run: |
          set -euo pipefail
          JARS_DIR=$(python -c "import pyspark, os; print(os.path.join(os.path.dirname(pyspark.__file__), 'jars'))")
          cp -v .s3a-jars/*.jar "$JARS_DIR/"
          echo "driver jars dir: $JARS_DIR"

      - name: Build & start Spark cluster (docker compose)
        working-directory: docker/spark-cluster
        run: |
          docker compose build --pull=false
          docker compose up -d

      # MinIO service 容器接入 autobatch-net（别名 minio）：worker 容器内
      # socat 代理固定转发 localhost:9000 → minio:9000，靠该别名解析。
      - name: Connect MinIO service to autobatch-net (alias minio)
        run: |
          set -euo pipefail
          MINIO_ID=$(docker ps --filter "name=minio" --format "{{.ID}}" | head -1)
          test -n "$MINIO_ID" || { echo "::error::MinIO service container not found"; exit 1; }
          docker network connect --alias minio autobatch-net "$MINIO_ID"

      - name: Wait for cluster ready (master + 2 ALIVE workers)
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            N=$(curl -fsSL http://localhost:8080/json/ 2>/dev/null \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for w in d.get('workers', []) if w.get('state') == 'ALIVE'))" \
              || echo 0)
            echo "attempt $i: ALIVE workers = $N"
            [ "$N" = "2" ] && exit 0
            sleep 5
          done
          echo "::error::cluster not ready (2 ALIVE workers) within 300s"
          docker compose -f docker/spark-cluster/docker-compose.yml ps
          exit 1

      # SPARK_CLUSTER_DRIVER_HOST：conftest 集群 fixture 的覆盖口——原生
      # Linux 缺省 localhost 会让 executor 回连容器自身 loopback（ refused
      # 崩溃循环），host.docker.internal 经 compose extra_hosts(host-gateway)
      # 解析到宿主，executor 可回连 Driver（Driver 绑定 0.0.0.0）。
      - name: Run Spark cluster tests
        shell: bash
        env:
          SPARK_CLUSTER_DRIVER_HOST: host.docker.internal
        run: |
          set -eo pipefail
          python -m pytest tests/test_engine_spark_cluster.py -v \
            --tb=short \
            2>&1 | tee /tmp/pytest-cluster.log

      - name: Surface failed tests as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) " /tmp/pytest-cluster.log | head -30 | while IFS= read -r line; do
            echo "::error::${line:0:180}"
          done
          grep -E "^(FAILED|ERROR) " /tmp/pytest-cluster.log | head -30 || echo "::error::no FAILED lines parsed (crash before summary?)"

      - name: Upload cluster test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-cluster-log
          path: /tmp/pytest-cluster.log
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down Spark cluster
        if: always()
        working-directory: docker/spark-cluster
        run: |
          docker compose down --remove-orphans

  # ===========================================================================
  # macOS 测试腿：单版本（3.12）验证 POSIX 兼容性，控制矩阵规模（任务78
  # 从原 matrix include 拆为独立 job）。
  # GHA service 容器仅支持 Linux runner，本 job 无 services 定义：
  #   - S3（MinIO）测试经 skipif 自动跳过（_minio_available() 探测
  #     localhost:9000 失败，MINIO_AVAILABLE=False）——与 Linux 腿加
  #     MinIO service 之前的行为一致
  #   - Spark 本地用例因缺 hadoop native 库由 skipif 自动跳过，与 Linux 一致
  # ===========================================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip    # 启用 pip 缓存，加速依赖安装

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 核心依赖（版本约束见 requirements.txt，与 pyproject.toml 可选依赖分组同步）
          pip install -r requirements.txt
          # optional 引擎依赖：与 build job 完全一致，pyspark / polars / pyarrow /
          # pyiceberg 均要求 Python >=3.10（本腿 3.12 全部可安装）；
          # pyiceberg==0.12.0rc1 精确 pin 原因见 build job 同步注释
          pip install "pyspark>=4.0,<5.0" "polars>=1.0,<2.0" "pyarrow>=23.0.1,<25.0" "pyiceberg==0.12.0rc1"
          pip install -r requirements-dev.txt

      # 与 build job 同口径：-k "not cluster" 排除 Spark 集群测试；
      # MinIO / hadoop native 依赖用例经 skipif 自动跳过。
      # 显式 shell: bash + set -eo pipefail：防 tee 管道掩蔽 pytest 失败退出码。
      - name: Run pytest (full suite; heavy tests self-skip via skipif)
        shell: bash
        run: |
          set -eo pipefail
          python -m pytest tests/ -v \
            -k "not cluster" \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html \
            --tb=short \
            2>&1 | tee /tmp/pytest-ci.log

      - name: Surface failed tests as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) " /tmp/pytest-ci.log | head -30 | while IFS= read -r line; do
            echo "::error::${line:0:180}"
          done
          grep -E "^(FAILED|ERROR) " /tmp/pytest-ci.log | head -30 || echo "::error::no FAILED lines parsed (crash before summary?)"

      - name: Upload coverage report (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # artifact 名称含 os 维度（任务71）：与 build job 的 3.12 腿同版本
          # 共存，os 后缀消除 upload-artifact@v4 的同 run 重名报错
          name: coverage-py3.12-macos-latest
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref_protected
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false   # 缺 token 不阻塞流水线

      - name: Pipeline smoke test
        id: smoke
        run: |
          python main.py --config config/pipeline_small.json

      - name: Upload run/ artifact on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          # os 字面量后缀防止与 build job（ubuntu）3.12 腿 artifact 重名
          name: smoke-run-py3.12-macos-latest
          path: run/
          if-no-files-found: warn
          retention-days: 7

  # ===========================================================================
  # 依赖安全扫描（pip-audit）—— 独立 job，与测试矩阵并行
  # ===========================================================================
  security-audit:
    name: Dependency Security Audit (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit runtime dependencies
        run: |
          echo "::group::pip-audit runtime"
          pip-audit -r requirements.txt --strict
          echo "::endgroup::"

      - name: Audit dev dependencies
        run: |
