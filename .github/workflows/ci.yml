# =============================================================================
# AutoBatch CI 流水线
# Phase 6 CI/CD 加固 + 任务61 修复：
#   - Python 矩阵覆盖 3.9 / 3.10 / 3.11 / 3.13 / 3.14（与 pyproject.toml target-version="py39" 对齐）
#   - Python 3.9 是最低支持版本，仅测试核心路径（python engine + local_csv）；
#     pyspark / pyarrow / polars / pyiceberg 均要求 Python >= 3.10，
#     因此 3.9 跳过这些引擎的依赖安装与等价性测试
#   - 3.14 标 continue-on-error（实验性，不阻塞流水线）
#   - push 限定 main / master / release/* 分支；pull_request 不限分支
#   - 顶层 concurrency 取消同分支旧任务，节省 CI 资源
#   - 新增 pip-audit 依赖安全扫描步骤
#   - smoke test 失败时上传 run/ 目录 artifact 便于诊断
# =============================================================================
name: CI / AutoBatch Pipeline CI

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'release/*'
  pull_request:

# 同一分支并发时取消旧任务，节省 CI 资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.9'        # 最低支持版本（core 路径：python engine + local_csv）
          - '3.10'       # 启用 pyspark / pyarrow / polars / pyiceberg
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'      # 实验性：不阻塞流水线
        include:
          - python-version: '3.14'
            experimental: true
          - python-version: '3.9'
            minimal: true
            experimental: false
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip    # 启用 pip 缓存，加速依赖安装

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 核心依赖（所有 Python 版本均安装；pydantic>=2.10.6,<2.23 保证 3.9 可装）
          pip install -r requirements.txt
          # 3.10+ 时启用 optional 依赖；3.9 跳过以规避：
          # - pyspark >=4.x 要求 Python >=3.10
          # - polars >=1.x 要求 Python >=3.10
          # - pyarrow >=21.x 要求 Python >=3.10（我们 pin <20.0 但部分版本仍需 3.10 wheel）
          # - pyiceberg 0.12.0rc1 要求 Python >=3.10
          if [ "${{ matrix.minimal }}" != "true" ]; then
            pip install "pyspark>=4.0,<5.0" "polars>=1.0,<2.0" "pyarrow>=14.0,<20.0" "pyiceberg==0.12.0rc1"
          fi
          pip install -r requirements-dev.txt

      # 全量运行；重型测试（Spark 集群/MinIO/需要 hadoop native lib 的路径）
      # 由 tests 内的 skipif 环境探测自动跳过——仓库未使用 pytest marker 标注
      # 3.9 运行时缺少 pyspark/polara/pyarrow/pyiceberg 依赖，等价性测试
      # 由 skipif(_PYSPARK_AVAILABLE) 等条件自动跳过
      - name: Run pytest (full suite; heavy tests self-skip via skipif)
        run: |
          python -m pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html

      - name: Upload coverage report (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

      # -------------------------------------------------------------------------
      # 可选：上传覆盖率到 Codecov（需在仓库 Secrets 配置 CODECOV_TOKEN）
      # 仅在 main / master 分支推送时执行，避免 PR 泄漏
      # -------------------------------------------------------------------------
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref_protected
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false   # 缺 token 不阻塞流水线

      - name: Pipeline smoke test
        id: smoke
        run: |
          python main.py --config config/pipeline_small.json

      # -------------------------------------------------------------------------
      # smoke test 失败诊断：上传 run/ 目录 artifact 便于排查
      # -------------------------------------------------------------------------
      - name: Upload run/ artifact on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run-py${{ matrix.python-version }}
          path: run/
          if-no-files-found: warn
          retention-days: 7

  # ===========================================================================
  # 依赖安全扫描（pip-audit）—— 独立 job，与测试矩阵并行
  # ===========================================================================
  security-audit:
    name: Dependency Security Audit (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit runtime dependencies
        run: |
          echo "::group::pip-audit runtime"
          pip-audit -r requirements.txt --strict
          echo "::endgroup::"

      - name: Audit dev dependencies
        run: |
          echo "::group::pip-audit dev"
          pip-audit -r requirements-dev.txt --strict
          echo "::endgroup::"
